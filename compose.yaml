services:
  novadb:
    build: .
    restart: unless-stopped
    environment:
      NOVADB_BEARER_TOKEN: ${NOVADB_BEARER_TOKEN:?set NOVADB_BEARER_TOKEN}
      RUST_LOG: novadb_server=info
    ports:
      - "8787:8787"
    volumes:
      - novadb-data:/var/lib/novadb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  novadb-data:
