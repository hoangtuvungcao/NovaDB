[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novadb-client"
version = "0.2.0"
description = "Official NovaDB HTTP client (standard library only)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["novadb", "sqlite", "database", "client", "sync"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Database",
]
dependencies = []

[tool.setuptools]
packages = ["novadb"]

[tool.setuptools.package-data]
novadb = ["py.typed"]
