[package]
name = "novadb-core"
description = "Embedded local-first database engine for NovaDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rusqlite = { workspace = true, features = ["backup", "hooks", "column_decltype", "window"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
md-5.workspace = true
sha1.workspace = true
hmac.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

# Same lint set as the workspace, except `unsafe_code` is `deny` instead of
# `forbid` so that exactly one function (`tune_lookaside` in src/lib.rs) can
# opt in. Everything else in this crate remains unsafe-free.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
