[package]
name = "novadb-cli"
description = "Command-line interface for NovaDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "novadb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
novadb-core = { path = "../novadb-core" }
novadb-server = { path = "../novadb-server" }
novadb-wire = { path = "../novadb-wire" }
novadb-mysql = { path = "../novadb-mysql" }
reqwest = { workspace = true, features = ["query"] }
rustls.workspace = true
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
