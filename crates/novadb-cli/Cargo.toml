[package]
name = "novadb-cli"
description = "Command-line interface for NovaDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "novadb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
novadb-core = { path = "../novadb-core" }
novadb-server = { path = "../novadb-server" }
novadb-wire = { path = "../novadb-wire" }
reqwest = { workspace = true, features = ["query"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
