# NovaDB is SQLite-based: exactly ONE writer per database file.
# Keep replicas: 1. Scaling this StatefulSet up does NOT create a cluster;
# each extra pod would get its own, unsynchronized volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: novadb
  namespace: novadb
  labels:
    app.kubernetes.io/name: novadb
spec:
  serviceName: novadb-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: novadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novadb
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # matches the `novadb` user in the Dockerfile
        runAsGroup: 10001
        fsGroup: 10001          # makes the PVC writable for uid 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: novadbd
          # Build and push the image from the repository Dockerfile, then set it here:
          #   docker build -t ghcr.io/<you>/novadb:0.1.2 . && docker push ghcr.io/<you>/novadb:0.1.2
          image: ghcr.io/REPLACE_ME/novadb:0.1.2
          imagePullPolicy: IfNotPresent
          args:
            - --listen=0.0.0.0:8787
            - --pg-listen=0.0.0.0:5432
            - --database-path=/var/lib/novadb/relay.sqlite3
            - --data-dir=/var/lib/novadb/databases
            - --request-timeout-secs=30
            - --pg-auth-method=scram-sha-256
            - --pg-max-connections=100
            # Browser apps calling the HTTP API directly need CORS:
            # - --cors-origin=https://app.example.com
          envFrom:
            - secretRef:
                name: novadb-credentials   # NOVADB_BEARER_TOKEN, NOVADB_PG_USER, NOVADB_PG_PASSWORD
          env:
            - name: RUST_LOG
              value: novadbd=info,novadb_server=info,novadb_wire=info,tower_http=warn
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/novadb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: novadb
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi
