# EXAMPLE ONLY. Do not commit real credentials.
# Generate your own values, e.g.:
#   kubectl -n novadb create secret generic novadb-credentials \
#     --from-literal=NOVADB_BEARER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=NOVADB_PG_USER=novadb \
#     --from-literal=NOVADB_PG_PASSWORD="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: novadb-credentials
  namespace: novadb
  labels:
    app.kubernetes.io/name: novadb
type: Opaque
stringData:
  NOVADB_BEARER_TOKEN: "REPLACE_ME_with_a_long_random_token"
  NOVADB_PG_USER: "novadb"
  NOVADB_PG_PASSWORD: "REPLACE_ME_with_a_long_random_password"
