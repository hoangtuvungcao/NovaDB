name: Bug report
description: Something in NovaDB does not work as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security vulnerabilities must not be reported here**; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands, SQL and data. Remove secrets (tokens, passwords).
      placeholder: |
        1. novadb serve --listen 127.0.0.1:8787 ...
        2. curl -X POST .../sql/execute -d '{"sql": "..."}'
        3. ...
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output / error message / logs
      render: text
  - type: input
    id: version
    attributes:
      label: NovaDB version
      description: Output of `novadb --version` (or the commit hash if built from source)
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Core engine / SQL / functions
        - T-SQL or MySQL rewriting
        - HTTP API (novadbd)
        - Web Studio
        - PostgreSQL wire gateway
        - MySQL wire gateway
        - Sync relay / push / pull
        - CLI or console
        - SDK - JavaScript/TypeScript
        - SDK - Python
        - SDK - C#/Unity
        - SDK - Go
        - Installer / Docker / Kubernetes
        - Documentation
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 x86_64, macOS 15 arm64, Windows 11, Docker ...
  - type: input
    id: client
    attributes:
      label: Client used
      placeholder: psql 16, psycopg 3.2, @novadb/client from master, DBeaver 24 ...
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the FAQ/limitations page.
          required: true
        - label: I removed tokens, passwords and private data from this report.
          required: true
