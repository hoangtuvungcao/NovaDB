name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - platform: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build client
        run: cargo build --release --target ${{ matrix.target }} --package novadb-cli --bin novadb
      - name: Build server
        run: cargo build --release --target ${{ matrix.target }} --package novadb-server --bin novadbd
      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          package="novadb-${{ matrix.platform }}"
          stage="dist/${package}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/novadb" "${stage}/"
          cp "target/${{ matrix.target }}/release/novadbd" "${stage}/"
          cp README.md LICENSE "${stage}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "novadb-${{ matrix.platform }}"
          $stage = Join-Path "dist" $package
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/novadb.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/novadbd.exe" $stage
          Copy-Item "README.md", "LICENSE" $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: novadb-${{ matrix.platform }}
          path: dist/novadb-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: novadb-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum novadb-* > SHA256SUMS.txt
      - name: Upload artifacts to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" = "master" ] || [ -z "$tag" ]; then
            tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "Uploading to release: ${tag}"
          gh release upload "${tag}" dist/* --clobber || gh release create "${tag}" dist/* --title "NovaDB ${tag}" --generate-notes

