[workspace]
members = [
    "crates/novadb-core",
    "crates/novadb-server",
    "crates/novadb-cli",
    "crates/novadb-wire",
    "crates/novadb-e2e",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["NovaDB contributors"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
regex = "1.11"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

